[package]
name = "jasper-ui-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jasper-ui-engine = { path = "..", default-features = false, features = ["ui-plugin-pack"] }
jaso = { git = "https://github.com/jasper-language/jasper-os", rev = "0f1e5c1b70dea503bceee33a745c2c6f312a9824", features = ["pack"] }
jasper-ui-read-verification = { path = "../verification/read-boundary" }
jasper-ui-host-surface-verification = { path = "../verification/host-surface" }

[[bin]]
name = "read_boundary"
path = "fuzz_targets/read_boundary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch_decode"
path = "fuzz_targets/batch_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_surface"
path = "fuzz_targets/host_surface.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ui_plugin_gate"
path = "fuzz_targets/ui_plugin_gate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_coordination"
path = "fuzz_targets/host_coordination.rs"
test = false
doc = false
bench = false
