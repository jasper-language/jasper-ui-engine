# Minimal integration fixture, not a production Chinese input configuration.
# 最小集成夹具，不是正式中文输入配置。
schema:
  schema_id: jasper_smoke
  name: Jasper smoke
  version: '1'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: jasper_smoke
  enable_user_dict: false
  enable_sentence: false
menu:
  page_size: 5
