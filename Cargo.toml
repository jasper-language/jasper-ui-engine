[package]
name = "jasper-ui-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-agnostic foundation for the Jasper UI native engine"
repository = "https://github.com/jasper-language/jasper-ui-engine"
rust-version = "1.89"

[dependencies]
# Taffy is the layout executor for the portable Flex/Grid/Block subset.
# Version is pinned after `cargo info` / license check (MIT); see docs/status.md.
taffy = "0.15.0"
# tiny-skia is a pure-Rust 2D rasterizer (BSD-3-Clause) used by the optional
# Canvas component renderer. Disable default features to keep the dependency
# surface small; the `std` feature is required by this crate.
tiny-skia = { version = "0.12.0", optional = true, default-features = false, features = ["std"] }
# cosmic-text provides real shaping, font fallback, bidi and line breaking.
# Kept optional so minimal/headless hosts can still build without a font stack.
cosmic-text = { version = "0.19.0", optional = true, default-features = false, features = ["std", "swash", "fontconfig"] }
# Desktop windowing/input host. Optional so headless and jasper-os builds stay light.
winit = { version = "0.30.13", optional = true }
# Real adapter enumeration for the desktop GPU host; the selection policy stays host-neutral.
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "0.4.0", optional = true }
softbuffer = { version = "0.4.8", optional = true }

# Replacement stack candidates: source-pinned, build/acceptance pending.
# Explicit font injection; no Parley system-font discovery or CPU GPU dependency.
vello_cpu = { version = "=0.3.0", optional = true, default-features = false, features = ["libm", "text", "u8_pipeline"] }
vello_gpu = { version = "=0.3.0", optional = true, default-features = false, features = ["std", "wgpu", "text"] }
parley = { version = "=0.12.0", optional = true, default-features = false, features = ["libm", "complex-scripts"] }

# Shared pinned native adapter; defaults do not acquire a window or system fonts.
# 共用固定原生适配器；默认不取得窗口或系统字体。
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "52739472460824ec7f1624ab135c09a4bbc99219", default-features = false, features = ["complex-scripts"], optional = true }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "52739472460824ec7f1624ab135c09a4bbc99219", default-features = false, optional = true }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "52739472460824ec7f1624ab135c09a4bbc99219", default-features = false, optional = true }
fontique = { version = "=0.12.0", default-features = false, optional = true }
keyboard-types = { version = "=0.8.3", optional = true }
anyrender = { version = "=0.14.0", optional = true }
anyrender_vello_cpu = { version = "=0.18.0", default-features = false, optional = true }

[features]
default = []
native-blitz-pending = ["dep:blitz-dom", "dep:blitz-traits", "dep:fontique", "dep:keyboard-types"]
native-blitz-cpu-pending = ["native-blitz-pending", "cpu-pending"]
# Shared source uses this internal cfg in both crates.
cpu-pending = ["native-blitz-pending", "dep:blitz-paint", "dep:anyrender", "dep:anyrender_vello_cpu"]
text-parley-pending = ["dep:parley"]
render-vello-cpu-pending = ["text-parley-pending", "dep:vello_cpu"]
render-vello-gpu-pending = ["text-parley-pending", "dep:vello_gpu"]
canvas-tiny-skia = ["dep:tiny-skia"]
real-text = ["dep:cosmic-text"]
desktop = ["dep:winit", "dep:softbuffer"]
gpu = ["dep:wgpu", "dep:pollster"]

[profile.release]
lto = "thin"
codegen-units = 1

[[example]]
name = "window"
required-features = ["desktop", "native-blitz-cpu-pending"]

[dev-dependencies]
proptest = { version = "1.9", default-features = false, features = ["std"] }

[[example]]
name = "hello"
required-features = ["native-blitz-cpu-pending"]

[[example]]
name = "pointer"
required-features = ["native-blitz-pending"]
