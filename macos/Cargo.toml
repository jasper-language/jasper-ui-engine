[package]
name = "jasper-ui-macos"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "jasper-ui"
path = "src/main.rs"

[dependencies]
# The macOS host consumes only the application-facing native engine surface.
# macOS 宿主只消费面向应用的原生引擎入口。
jasper-ui-engine = { path = "..", default-features = false, features = [
    "desktop",
    "gpu-pending",
    "desktop-accessibility",
] }
winit = "=0.30.13"
wgpu = "=30.0.1"
wgpu_context = "=0.10.0"
pollster = "=0.4.0"
accesskit_winit = "=0.34.2"
log = "0.4.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
