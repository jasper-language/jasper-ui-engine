[package]
name = "jasper-mockup"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "High-fidelity macOS-style single-screen mockup rendered with egui"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
